# NU87-TinyDK / RTL8720DF (Ameba-D) — OpenOCD SWD 설정
#
# 결선: P3 "MP Header"
#   1 = VMCU (VTREF)   2 = PA27/SWDIO   3 = GND   4 = PB3/SWCLK   5 = CHIP_EN
#
# AP 맵 (SDK project_hp/jlink_script/ 기준, 실측 확인됨)
#   AP0 = APB-AP (CoreSight, 코어 없음)
#   AP1 = AHB-AP -> KM0 (Cortex-M23)      gdb :3333
#   AP2 = AHB-AP -> KM4 (Cortex-M33급)    gdb :3334
#   AP3 = APB-AP -> CTRL_AP (SWD 패스워드 / 디버그 락)
#
# 주의
#   - interface/stlink.cfg 는 hla 드라이버(AP0 고정)라 쓸 수 없다. stlink-dap.cfg 를 쓴다.
#   - ST-LINK 는 V2/V2-1 만 가능하고 펌웨어 >= V2J32 가 필요하다. V3 는 비-ST 타겟을 거부한다.
#   - KM0 가 KM4 에 전원을 넣는다. KM0 가 부팅 전이면 AP2 가 응답하지 않는다.
#   - SW3 을 누르면 PA27(SWDIO)이 GND 로 당겨지고, PA27 은 NORMAL_MODE_SEL 부팅 스트랩이다.
#     파워온 시점에 Low 면 부팅에 실패한다. 디버깅 중 누르지 말 것.

# ── 프로브 선택 ────────────────────────────────────────────────────────────
# ST-LINK/V2-1 (기본)
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# CMSIS-DAP / DAPLink 를 쓸 경우 위 두 줄을 지우고 아래를 사용
#source [find interface/cmsis-dap.cfg]
#transport select swd

# J-Link 를 쓸 경우
#source [find interface/jlink.cfg]
#transport select swd

adapter speed 480

# ── DAP / 타겟 ────────────────────────────────────────────────────────────
source [find target/swj-dp.tcl]

set _CHIPNAME rtl872xd
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x6ba02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.km0 cortex_m -dap $_CHIPNAME.dap -ap-num 1 -gdb-port 3333
target create $_CHIPNAME.km4 cortex_m -dap $_CHIPNAME.dap -ap-num 2 -gdb-port 3334

# 코드가 XIP(플래시)에서 실행되므로 소프트웨어 브레이크포인트를 쓸 수 없다.
# 하드웨어 BP 는 코어당 2 개뿐이다.
# (OpenOCD 0.12 는 밑줄 표기. 0.13+ 는 "gdb breakpoint_override hard")
gdb_breakpoint_override hard

# 기본 타겟을 KM4 로
targets $_CHIPNAME.km4

# ── 편의 프로시저 ──────────────────────────────────────────────────────────

# 전체 플래시 백업 (4MB). 작업 전에 반드시 한 번 떠 둘 것.
proc nu87_backup {{file flash_backup.bin}} {
  targets rtl872xd.km4
  halt
  dump_image $file 0x08000000 0x400000
  resume
  echo "backup -> $file"
}

# 현재 플래시의 이미지 헤더 체인 확인
proc nu87_imginfo {} {
  targets rtl872xd.km4
  halt
  echo "--- KM0 IMG1 @0x08000000 ---" ; mdw 0x08000000 4
  echo "--- KM4 IMG1 @0x08004000 ---" ; mdw 0x08004000 4
  echo "--- IMG2 OTA1 @0x08006000 ---"; mdw 0x08006000 4
  echo "--- KM0 XIP  @0x0C000000 ---" ; mdw 0x0C000000 4
  echo "--- KM4 XIP  @0x0E000000 ---" ; mdw 0x0E000000 4
  resume
}
