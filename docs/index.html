<!doctype html>
<!--
  NU87-TinyDK 설정 페이지 — GitHub Pages 에서 서빙한다.

  보드에 붙어 CLI 를 그대로 몰고, 그 출력을 파싱해 보여준다. 펌웨어에 전용
  프로토콜을 두지 않은 이유는 CLI 가 이미 모든 것을 할 수 있기 때문이다.

  통로가 둘이다. Web Bluetooth 와 Web Serial(USB). 붙고 나면 화면은 완전히
  같으므로 탭이 아니라 헤더에 두었고, 아래 transport 하나만 갈아끼운다.
  펌웨어가 uart_driver_t 로 같은 일을 한다.

  화면은 위가 탭, 아래가 콘솔이다. 콘솔을 고정해 두면 무엇을 하든 보드가
  뭐라고 답했는지 항상 보인다.

  펌웨어 문서는 firmware/docs/ 에 있다. 이 폴더는 Pages 용이다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NU87-TinyDK</title>
<style>
  /* chcbaram.github.io 의 다른 도구 페이지와 같은 계열. 강조색만 보드별로 다르다. */
  :root {
    --bg: #eceaf0;
    --panel: #fbfafc;
    --line: #dcd8e4;
    --text: #1b1c22;
    --dim: #6b6f7a;
    --accent: #4a6ea9;
    --ok: #2f8a4d;
    --err: #c0392f;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13; --panel: #171922; --line: #2a2e3a;
      --text: #e7e9ee; --dim: #9aa0ad; --accent: #7ea3dd;
      --ok: #57c877; --err: #e06a5f;
    }
  }
  * { box-sizing: border-box; }

  /* 화면 높이를 꽉 쓰되 좌우로는 퍼지지 않게 한다. 넓은 모니터에서 헤더가
   * 끝에서 끝까지 늘어나면 내용이 허공에 뜬 것처럼 보인다. */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; height: 100dvh;
  }
  .app {
    width: 100%; max-width: 900px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
    overflow: hidden;   /* 안쪽이 커져도 앱이 화면 밖으로 자라지 않게 */
  }
  @media (min-width: 900px) {
    .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  }

  header {
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  h1 .sub { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 4px; }
  .grow { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); }
  #via { color: var(--dim); font-size: 13px; margin-right: 6px; }

  button {
    font: inherit; padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    /* flex/grid 안에서 줄어들면 글자가 두 줄로 접힌다 */
    white-space: nowrap; flex: none;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button[hidden] { display: none; }

  /* 상태 카드 — 어느 탭에 있든 핵심은 항상 보인다. */
  .status { flex: none; display: grid; gap: 10px; padding: 12px 14px 0;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 13px;
  }
  .stat span { display: block; font-size: 11px; color: var(--dim); }
  .stat b { font-family: var(--mono); font-size: 14px; font-weight: 500;
            display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tabs { display: flex; gap: 4px; flex: none;
          border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button {
    border: none; background: none; border-radius: 0;
    font-size: 14px; line-height: 1.4; padding: 8px 14px;
    color: var(--dim); display: flex; align-items: center; gap: 6px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .badge { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .badge.on { background: var(--ok); }

  /* 탭 내용. 스크롤은 이 안에서 일어난다. */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px 0; }
  main > section { display: none; }
  main > section.on { display: block; flex: 1; min-height: 0; overflow-y: auto;
                      padding-bottom: 4px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
  }

  #msg { min-height: 22px; font-size: 13px; margin-bottom: 12px; }
  #msg.err { color: var(--err); }
  #msg.ok  { color: var(--ok); }

  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0 0 18px; }
  dt { color: var(--dim); font-size: 13px; }
  dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 0 0 12px; font-weight: 600; }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

  /* 최대 24개까지 나온다. 다 펼치면 아래 폼이 밀린다. */
  .aplist { list-style: none; margin: 0 0 14px; padding: 0;
            border: 1px solid var(--line); border-radius: 7px;
            max-height: 200px; overflow-y: auto; background: var(--bg); }
  .aplist li { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
               cursor: pointer; border-top: 1px solid var(--line); }
  .aplist li:first-child { border-top: none; }
  .aplist li:hover { background: var(--line); }
  .aplist .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  .aplist .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); flex: none; }

  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }

  .note { color: var(--dim); font-size: 13px; }
  .note code { font-family: var(--mono); font-size: 12px; }

  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden;
         margin: 10px 0; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* 내용과 콘솔 사이의 분리막. 끌어서 높이를 나눈다. */
  .splitter {
    flex: none; height: 7px; cursor: row-resize; background: var(--bg);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .splitter:hover, .splitter.drag { background: var(--line); }

  /* 콘솔 — 바닥 고정. 창이 낮으면 접어서 입력줄만 남긴다. */
  footer { flex: none; display: flex; flex-direction: column;
           background: var(--panel); padding: 8px 14px 10px; height: 200px; }
  .termbar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .termbar h2 { margin: 0; flex: 1; }
  .termbar button { padding: 4px 10px; font-size: 13px; }
  #term {
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-all;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 10px; flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 8px;
  }
  footer.fold #term { display: none; }
  .cmdline { display: flex; gap: 8px; }
  .cmdline input { font-family: var(--mono); flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="app">

<header>
  <h1>NU87-TinyDK <span class="sub">개발보드</span></h1>
  <span class="grow"></span>
  <span class="dot" id="dot"></span>
  <span id="via">연결 안 됨</span>
  <button class="primary" id="btnBle">BLE 연결</button>
  <button id="btnUsb">USB 연결</button>
  <button id="btnDisconnect" disabled>해제</button>
</header>

<div class="status" id="status">
  <div class="stat"><span>이름</span><b id="s-name">—</b></div>
  <div class="stat"><span>펌웨어</span><b id="s-ver">—</b></div>
  <div class="stat"><span>네트워크</span><b id="s-net">—</b></div>
  <div class="stat"><span>IP</span><b id="s-ip">—</b></div>
  <div class="stat"><span>실행 슬롯</span><b id="s-slot">—</b></div>
</div>

<main>
  <nav class="tabs">
    <button class="on" data-tab="board">보드</button>
    <button data-tab="wifi">WiFi <span class="badge" id="badgeNet"></span></button>
    <button data-tab="fw">펌웨어</button>
  </nav>

  <section id="tab-board" class="on">
    <div id="msg"></div>
    <div class="card">
      <h2>상세</h2>
      <dl id="info"><dt>상태</dt><dd>—</dd></dl>
      <button id="btnRefresh" disabled>갱신</button>
    </div>
  </section>

  <section id="tab-wifi">
    <div class="card">
      <h2>주변 검색</h2>
      <div class="row">
        <button id="btnScan" disabled>검색</button>
        <span class="note" id="scanNote"></span>
      </div>
      <ul class="aplist" id="aplist" hidden></ul>
    </div>

    <div class="card">
      <h2>접속</h2>
      <form id="wifiForm">
      <div>
        <label for="ssid">SSID</label>
        <input id="ssid" autocomplete="off" spellcheck="false" placeholder="공유기 이름">
      </div>
      <div>
        <label for="pass">비밀번호</label>
        <input id="pass" type="password" autocomplete="off" placeholder="없으면 비워 둔다">
      </div>
        <button class="primary" id="btnWifi" disabled>접속</button>
      </form>
      <p class="note" style="margin-bottom:0">저장 후 다음 부팅부터 자동으로 붙는다. <code>nvs</code> 에 남는다.</p>
    </div>
  </section>

  <section id="tab-fw">
    <div class="card">
      <h2>슬롯</h2>
      <dl id="otaInfo"><dt>실행 중</dt><dd>—</dd></dl>
      <p class="note" style="margin-bottom:0">
        쓰기는 지금 실행 중이 아닌 슬롯으로 간다. 실패해도 지금 펌웨어가 그대로
        남아 보드가 죽지 않는다. 다 받고 검증된 뒤에야 부팅 슬롯이 바뀐다.
      </p>
    </div>

    <div class="card">
      <h2>업데이트</h2>
      <div class="row">
        <input type="file" id="fwFile" accept=".bin" style="flex:1;min-width:200px">
        <button class="primary" id="btnFlash" disabled>보내기</button>
      </div>
      <div class="bar"><div id="fwBar"></div></div>
      <p class="note" id="fwNote" style="margin-bottom:0">km0_km4_image2.bin 을 고를 것.</p>
    </div>
  </section>
</main>

<div class="splitter" id="splitter" title="끌어서 높이 조절"></div>

<footer id="console">
  <div class="card">
  <div class="termbar">
    <h2>콘솔</h2>
    <button id="btnFold">접기</button>
    <button id="btnClear">지우기</button>
  </div>
  <div id="term"></div>
  <div class="cmdline">
    <input id="cmd" placeholder="help" autocomplete="off" spellcheck="false" disabled>
    <button id="btnSend" disabled>보내기</button>
  </div>
  </div>
</footer>

</div>

<script>
/* 펌웨어 hw/driver/ble_svc.c 의 정의와 같아야 한다. */
const SVC    = 0xFF87;
const CLI_RX = 0xFF88;   /* 호스트 -> 보드 */
const CLI_TX = 0xFF89;   /* 보드 -> 호스트 */
const DAT_RX = 0xFF8A;   /* 대량 전송용 */
const DAT_TX = 0xFF8B;

const PROMPT = 'cli# ';
const CHUNK  = 1024;     /* 펌웨어의 OTA_CHUNK_MAX 이하 */

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();

let transport = null;    /* { name, writeCli, writeDat, onDat, close } */
let rxBuf  = '';
let waiter = null;

/* notify 는 잘려 온다. 한글은 UTF-8 로 3 바이트라 글자 하나가 두 조각에
 * 걸치는 일이 흔하다. 스트림 모드로 두어 걸친 조각을 이어 붙인다.
 * 이걸 빠뜨리면 "동기됨" 이 "동???됨" 으로 보인다. */
let dec = new TextDecoder('utf-8');


/* ── 화면 ──────────────────────────────────────────────────────────── */

function say(text, kind) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = kind || '';
}

function termWrite(text) {
  const el = $('term');
  el.textContent += text;
  el.scrollTop = el.scrollHeight;
}

function setConnected(on, via) {
  $('dot').classList.toggle('on', on);
  $('via').textContent = on ? (via || '') : '';
  $('btnBle').disabled = on;
  $('btnUsb').disabled = on;
  for (const id of ['btnDisconnect', 'btnWifi', 'btnScan', 'btnSend',
                    'btnRefresh', 'btnFlash', 'cmd'])
    $(id).disabled = !on;
}


/* ── 통로 ──────────────────────────────────────────────────────────── */

/* CLI 출력을 모으고 프롬프트가 보이면 한 명령이 끝난 것으로 본다.
 * 보드는 글자마다 에코를 돌려주고 끝에 프롬프트를 찍는다. */
function onCliData(bytes) {
  const text = dec.decode(bytes, { stream: true });
  rxBuf += text;
  termWrite(text);

  if (waiter && rxBuf.includes(PROMPT)) {
    const done = waiter;
    waiter = null;
    done(rxBuf);
  }
}

async function openBle() {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ services: [SVC] }],
    optionalServices: [SVC],
  });
  device.addEventListener('gattserverdisconnected', () => {
    transport = null;
    setConnected(false);
    say('연결이 끊겼다');
  });

  const gatt = await device.gatt.connect();
  const svc  = await gatt.getPrimaryService(SVC);

  const cliRx = await svc.getCharacteristic(CLI_RX);
  const datRx = await svc.getCharacteristic(DAT_RX);

  /* CLI TX 를 구독해야 보드가 CLI 를 BLE 쪽으로 넘긴다. cli_mgr 이
   * cliBleIsConnected() 로 판단하는데 그게 notify 여부를 본다. */
  const cliTx = await svc.getCharacteristic(CLI_TX);
  await cliTx.startNotifications();
  cliTx.addEventListener('characteristicvaluechanged',
                         (e) => onCliData(e.target.value));

  const datTx = await svc.getCharacteristic(DAT_TX);
  await datTx.startNotifications();

  let datCb = null;
  datTx.addEventListener('characteristicvaluechanged', (e) => {
    if (datCb) datCb(new Uint8Array(e.target.value.buffer));
  });

  /* 한 번에 보낼 수 있는 크기는 MTU-3 이다. 협상값을 알 수 없어 최소 MTU
   * 기준으로 자른다. */
  const write = async (ch, bytes) => {
    for (let i = 0; i < bytes.length; i += 20) {
      const part = bytes.slice(i, i + 20);
      if (ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(part);
      else                              await ch.writeValue(part);
    }
  };

  return {
    name: 'BLE',
    dataChannel: 4,                        /* _DEF_UART4 = HW_UART_CH_BLE_DATA */
    writeCli: (b) => write(cliRx, b),
    writeDat: (b) => write(datRx, b),
    onDat: (cb) => { datCb = cb; },
    close: () => { if (device.gatt.connected) device.gatt.disconnect(); },
  };
}

async function openUsb() {
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 115200 });

  const writer = port.writable.getWriter();
  let datCb = null;

  /* USB 는 채널이 하나다. CLI 와 대량 전송이 같은 선을 쓴다.
   * ota write 에 채널을 주지 않으면 보드가 지금 CLI 채널로 받는다. */
  (async () => {
    const reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (datCb) datCb(value);
        else       onCliData(value);
      }
    } catch (e) { /* 포트가 닫히면 여기로 온다 */ }
    reader.releaseLock();
  })();

  return {
    name: 'USB',
    dataChannel: null,
    writeCli: (b) => writer.write(b),
    writeDat: (b) => writer.write(b),
    onDat: (cb) => { datCb = cb; },
    close: async () => { writer.releaseLock(); await port.close(); },
  };
}

async function connect(open, label) {
  try {
    say(label + ' 연결 중…');
    transport = await open();

    dec = new TextDecoder('utf-8');   /* 이전 연결에서 남은 조각을 버린다 */
    setConnected(true, transport.name);
    say('연결됨', 'ok');
    $('term').textContent = '';

    await refresh();
  } catch (e) {
    transport = null;
    say(e.message, 'err');
    setConnected(false);
  }
}

function disconnect() {
  if (transport) transport.close();
  transport = null;
  setConnected(false);
  say('');
}


/* ── CLI ───────────────────────────────────────────────────────────── */

async function send(line, timeoutMs = 6000) {
  if (!transport) throw new Error('연결되지 않았다');

  rxBuf = '';
  const answer = new Promise((resolve) => {
    waiter = resolve;
    setTimeout(() => {
      if (waiter === resolve) { waiter = null; resolve(rxBuf); }
    }, timeoutMs);
  });

  /* CLI 는 Enter 를 CR 로만 받는다. */
  await transport.writeCli(enc.encode(line + '\r'));
  return answer;
}

/* CLI 출력은 "key   : value" 꼴이다. */
function parseKV(text) {
  const out = {};
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*([A-Za-z가-힣 ]+?)\s*:\s*(.+?)\s*$/);
    if (m && m[1] !== 'cli') out[m[1]] = m[2];
  }
  return out;
}

function renderDl(el, rows) {
  el.innerHTML = '';
  for (const [k, v] of rows) {
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = k;
    dd.textContent = v;
    el.append(dt, dd);
  }
}

async function refresh() {
  try {
    const net = parseKV(await send('net info'));
    const ble = parseKV(await send('ble info'));
    const ota = parseKV(await send('ota info'));


    renderDl($('info'), [
      ['이름',     ble.name  || '—'],
      ['상태',     net.state || '—'],
      ['SSID',     net.ssid  || '—'],
      ['IP',       net.ip    || '—'],
      ['시각',     net.time  || '—'],
      ['WiFi MAC', net.mac   || '—'],
      ['BT MAC',   ble.mac   || '—'],
    ]);

    renderDl($('otaInfo'), [
      ['실행 중',   ota['실행'] || '—'],
      ['쓸 곳',     ota['대상'] || '—'],
      ['슬롯 크기', ota['크기'] || '—'],
    ]);

    $('s-name').textContent = ble.name  || '—';
    $('s-ver').textContent  = ota.ver   || '—';
    $('s-net').textContent  = net.state || '—';
    $('s-ip').textContent   = net.ip    || '—';
    $('s-slot').textContent = (ota['실행'] || '—').split(' ')[0];

    $('badgeNet').classList.toggle('on', net.state === 'ONLINE');
    if (net.ssid && net.ssid !== '(없음)') $('ssid').value = net.ssid;
  } catch (e) {
    say(e.message, 'err');
  }
}


/* ── WiFi ──────────────────────────────────────────────────────────── */

/* wifi scan 출력은 고정폭 표다.
 *   no  ssid                       rssi  chan  security
 *   0   olleh_WiFi_4479             -62     9  WPA/WPA2
 * SSID 에 공백이 들어갈 수 있어 앞뒤에서 잘라 가운데를 이름으로 본다. */
function parseScan(text) {
  const list = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*\d+\s+(.*?)\s+(-?\d+)\s+(\d+)\s+(\S+)\s*$/);
    if (m) list.push({ ssid: m[1], rssi: +m[2], chan: +m[3], sec: m[4] });
  }
  return list;
}

function renderScan(list) {
  const ul = $('aplist');
  ul.innerHTML = '';
  ul.hidden = list.length === 0;

  for (const ap of list) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    const meta = document.createElement('span');

    name.className = 'name';
    name.textContent = ap.ssid;
    meta.className = 'meta';
    meta.textContent = ap.rssi + ' dBm  ch' + ap.chan + '  ' + ap.sec;

    li.append(name, meta);
    li.addEventListener('click', () => {
      $('ssid').value = ap.ssid;
      $('pass').focus();
    });
    ul.append(li);
  }
}

async function scan() {
  $('btnScan').disabled = true;
  $('scanNote').textContent = '검색 중… 10초쯤 걸린다';
  try {
    /* 보드가 스캔하는 동안 CLI 가 막힌다. 넉넉히 기다린다. */
    const list = parseScan(await send('wifi scan', 20000));
    renderScan(list);
    $('scanNote').textContent = list.length + ' 개';
  } catch (e) {
    $('scanNote').textContent = e.message;
  }
  $('btnScan').disabled = false;
}

/* 접속은 보드의 스레드가 진행한다. 정해진 시간을 기다리는 대신 상태를 물어본다. */
async function waitOnline(timeoutMs = 25000) {
  const until = Date.now() + timeoutMs;

  while (Date.now() < until) {
    const net = parseKV(await send('net info'));
    if (net.state === 'ONLINE') return net;
    say('접속 중… ' + (net.state || ''));
    await new Promise((r) => setTimeout(r, 2000));
  }
  return null;
}


/* ── 펌웨어 ────────────────────────────────────────────────────────── */

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (const b of bytes) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
  }
  return (~crc) >>> 0;
}

/* len(2 LE) | data | sum(1). 링크에서 한 바이트가 밀려도 이 청크만 다시 보낸다. */
function frame(data) {
  const out = new Uint8Array(data.length + 3);
  out[0] = data.length & 0xFF;
  out[1] = data.length >> 8;
  out.set(data, 2);
  let sum = 0;
  for (const b of data) sum = (sum + b) & 0xFF;
  out[out.length - 1] = sum;
  return out;
}

/* 데이터 채널로 오는 한 줄을 기다린다. 보드가 보내는 말은 전부 한 줄이다. */
function makeLineReader() {
  let buf = '';
  const lines = [];
  let wake = null;
  const d = new TextDecoder('utf-8');

  transport.onDat((bytes) => {
    buf += d.decode(bytes, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) lines.push(line);
    }
    if (wake) { const w = wake; wake = null; w(); }
  });

  return async (timeoutMs = 15000) => {
    const until = Date.now() + timeoutMs;
    while (Date.now() < until) {
      if (lines.length) return lines.shift();
      await new Promise((r) => { wake = r; setTimeout(r, 200); });
    }
    throw new Error('보드가 응답하지 않는다');
  };
}

async function flashFirmware(file) {
  const payload = new Uint8Array(await file.arrayBuffer());
  const crc = crc32(payload);

  $('btnFlash').disabled = true;
  $('fwNote').textContent = `${file.name} · ${payload.length} B · crc32 0x${crc.toString(16).toUpperCase()}`;

  try {
    const readLine = makeLineReader();
    const ch = transport.dataChannel ? ' ' + transport.dataChannel : '';

    await transport.writeCli(enc.encode(`ota write ${payload.length} ${crc}${ch}\r`));

    let line = await readLine();
    if (line !== 'ready') throw new Error('보드: ' + line);

    let sent = 0;
    let resend = 0;
    const started = Date.now();

    while (sent < payload.length) {
      const chunk = payload.slice(sent, sent + CHUNK);
      await transport.writeDat(frame(chunk));

      line = await readLine();
      if (line === 'r') {
        if (++resend > 5) throw new Error('같은 청크가 계속 깨진다');
        continue;
      }
      if (line !== 'a') throw new Error('보드: ' + line);

      resend = 0;
      sent += chunk.length;

      const pct = Math.floor(sent * 100 / payload.length);
      const rate = sent / Math.max(0.001, (Date.now() - started) / 1000) / 1024;
      $('fwBar').style.width = pct + '%';
      $('fwNote').textContent = `${pct}%  ${sent}/${payload.length} B  ${rate.toFixed(1)} KB/s`;
    }

    line = await readLine(30000);
    if (line !== 'ok') throw new Error('보드: ' + line);

    $('fwNote').textContent = '전환 완료. 재부팅하면 새 펌웨어로 뜬다';
    say('업데이트 완료', 'ok');
  } catch (e) {
    $('fwNote').textContent = '실패: ' + e.message;
    say(e.message, 'err');
  }

  transport.onDat(null);
  $('btnFlash').disabled = false;
}


/* ── 붙이기 ────────────────────────────────────────────────────────── */

for (const btn of document.querySelectorAll('.tabs button')) {
  btn.addEventListener('click', () => {
    for (const b of document.querySelectorAll('.tabs button')) b.classList.remove('on');
    for (const s of document.querySelectorAll('main > section')) s.classList.remove('on');
    btn.classList.add('on');
    $('tab-' + btn.dataset.tab).classList.add('on');
  });
}

$('btnBle').addEventListener('click', () => connect(openBle, 'BLE'));
$('btnUsb').addEventListener('click', () => connect(openUsb, 'USB'));
$('btnDisconnect').addEventListener('click', disconnect);
$('btnRefresh').addEventListener('click', refresh);
$('btnScan').addEventListener('click', scan);
$('btnClear').addEventListener('click', () => { $('term').textContent = ''; });

/* 콘솔 높이 — 분리막을 끌어 나눈다. 다음에 열 때도 그 높이를 쓴다. */
const CONSOLE_MIN = 108;     /* 제목줄 + 입력줄만 남는 높이 */

/* 상한은 화면 높이로 잡는다. 앱의 측정 높이를 쓰면, 한 번 넘친 순간 그 값도
 * 같이 커져서 끌수록 계속 커지는 되먹임이 생긴다. */
function setConsoleHeight(px) {
  const vh  = document.documentElement.clientHeight;
  const max = Math.max(CONSOLE_MIN, vh - 260);   /* 헤더+상태+탭+최소 내용 */
  const h   = Math.min(max, Math.max(CONSOLE_MIN, Math.round(px)));

  $('console').style.height = h + 'px';
  $('console').classList.toggle('fold', h <= CONSOLE_MIN);
  $('btnFold').textContent = h <= CONSOLE_MIN ? '펴기' : '접기';
  localStorage.setItem('consoleHeight', h);
}

setConsoleHeight(+localStorage.getItem('consoleHeight') || 220);

/* 창 크기가 바뀌면 상한도 바뀐다. 다시 맞춘다. */
addEventListener('resize', () => setConsoleHeight($('console').offsetHeight));

$('btnFold').addEventListener('click', () => {
  const folded = $('console').classList.contains('fold');
  setConsoleHeight(folded ? 220 : CONSOLE_MIN);
});

{
  const sp = $('splitter');
  let dragging = false;

  sp.addEventListener('pointerdown', (e) => {
    dragging = true;
    sp.classList.add('drag');
    sp.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  sp.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    setConsoleHeight(document.documentElement.clientHeight - e.clientY);
  });

  const stop = () => { dragging = false; sp.classList.remove('drag'); };
  sp.addEventListener('pointerup', stop);
  sp.addEventListener('pointercancel', stop);
}

$('btnFlash').addEventListener('click', () => {
  const file = $('fwFile').files[0];
  if (!file) { say('파일을 고를 것', 'err'); return; }
  flashFirmware(file);
});

$('wifiForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ssid = $('ssid').value.trim();
  const pass = $('pass').value;

  if (!ssid) { say('SSID 를 입력할 것', 'err'); return; }

  $('btnWifi').disabled = true;
  say('접속 요청 중…');

  try {
    await send('net connect ' + ssid + (pass ? ' ' + pass : ''));

    const net = await waitOnline();
    await refresh();

    if (net) say('접속됨 ' + (net.ip || '') + ' — 다음 부팅부터 자동', 'ok');
    else     say('시간 안에 붙지 못했다. SSID 와 비밀번호를 확인할 것', 'err');
  } catch (e) {
    say(e.message, 'err');
  }
  $('btnWifi').disabled = false;
});

$('btnSend').addEventListener('click', () => $('cmd').dispatchEvent(
  new KeyboardEvent('keydown', { key: 'Enter' })));

$('cmd').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const line = $('cmd').value;
  $('cmd').value = '';
  await send(line);
});

/* 안드로이드 Chrome 에는 Web Serial 이 없다. 있는 것만 보여준다. */
if (!navigator.serial)    $('btnUsb').hidden = true;
if (!navigator.bluetooth) $('btnBle').hidden = true;

if (!navigator.bluetooth && !navigator.serial) {
  say('이 브라우저는 Web Bluetooth / Web Serial 을 지원하지 않는다. Chrome 이나 Edge 를 쓸 것', 'err');
}
