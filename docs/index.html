<!doctype html>
<!--
  NU87-TinyDK 설정 페이지 — GitHub Pages 에서 서빙한다.

  보드에 붙어 CLI 를 그대로 몰고, 그 출력을 파싱해 보여준다. 펌웨어에 전용
  프로토콜을 두지 않은 이유는 CLI 가 이미 모든 것을 할 수 있기 때문이다.

  통로는 Web Bluetooth 와 Web Serial(USB) 둘이다. 붙고 나면 화면은 완전히
  같으므로 transport 하나만 갈아끼운다. 펌웨어가 uart_driver_t 로 같은 일을 한다.

  화면 규칙은 셋뿐이다.
    면은 두 단계   바탕(--bg) > 카드(--panel) > 그 위 컨트롤(--bg)
    패널 머리 하나 왼쪽은 탭, 오른쪽은 그 패널의 동작
    연결 상태는 버튼 색이 아니라 보이는 컨트롤 자체로 나타낸다

  펌웨어 문서는 firmware/docs/ 에 있다. 이 폴더는 Pages 용이다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NU87-TinyDK</title>
<style>
  /* chcbaram.github.io 의 다른 도구 페이지와 같은 계열. 강조색만 보드별로 다르다. */
  :root {
    --bg: #eceaf0;
    --panel: #fbfafc;
    --line: #dcd8e4;
    --text: #1b1c22;
    --dim: #6b6f7a;
    --accent: #4a6ea9;
    --ok: #2f8a4d;
    --err: #c0392f;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13; --panel: #171922; --line: #2a2e3a;
      --text: #e7e9ee; --dim: #9aa0ad; --accent: #7ea3dd;
      --ok: #57c877; --err: #e06a5f;
    }
  }
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; height: 100dvh;
  }
  .app {
    width: 100%; max-width: 900px; height: 100%;
    display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 900px) {
    .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  }

  /* ── 머리 ─────────────────────────────────────────────────────────── */
  header { flex: none; padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
           background: var(--panel); }
  .titlerow { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 4px; }
  .grow { flex: 1; }

  #summary { font-family: var(--mono); font-size: 12.5px; color: var(--dim);
             margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .link { display: flex; align-items: center; gap: 8px; }
  .link .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .link b { font-weight: 600; font-size: 13px; }
  [hidden] { display: none !important; }

  button {
    font: inherit; font-size: 14px; padding: 6px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    white-space: nowrap; flex: none;
  }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }

  /* ── 패널 머리 — 위아래가 같은 틀을 쓴다 ──────────────────────────── */
  .panelhead { display: flex; align-items: flex-end; gap: 6px; flex: none;
               border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .panelhead .act { margin-bottom: 7px; padding: 3px 10px; font-size: 13px; }

  .tabs { display: flex; gap: 2px; }
  .tabs button {
    border: none; background: none; border-radius: 0; padding: 8px 14px;
    color: var(--dim); display: flex; align-items: center; gap: 6px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .badge { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .badge.on { background: var(--ok); }

  /* ── 본문 ─────────────────────────────────────────────────────────── */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 0; }
  main > section { display: none; }
  main > section.on { display: block; flex: 1; min-height: 0; overflow-y: auto; }

  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
  .card > :last-child { margin-bottom: 0; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 0 0 12px; font-weight: 600; }

  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
  dt { color: var(--dim); font-size: 13px; }
  dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .note { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  .note code { font-family: var(--mono); font-size: 12px; }

  #msg { min-height: 20px; font-size: 13px; margin-bottom: 10px; color: var(--dim); }
  #msg.err { color: var(--err); }
  #msg.ok  { color: var(--ok); }

  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  /* 라디오는 폭을 늘리지 않는다. 아래 input 규칙이 width:100% 를 준다. */
  label.pick { display: flex; align-items: center; gap: 6px; margin: 0;
               font-size: 14px; color: var(--text); cursor: pointer; }
  label.pick input { width: auto; margin: 0; }

  input, select {
    font: inherit; font-size: 14px; width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }

  .bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden;
         border: 1px solid var(--line); margin: 12px 0 0; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* ── 콘솔 ─────────────────────────────────────────────────────────── */
  /* 정하는 값은 term 높이 하나뿐이고 나머지는 따라온다. 바깥 높이를 따로 정하고
   * 안에서 또 나누면 둘이 물려 계속 어긋난다. */
  .splitter { flex: none; height: 12px; cursor: row-resize;
              display: flex; align-items: center; justify-content: center; }
  .splitter::after { content: ''; width: 38px; height: 3px; border-radius: 2px;
                     background: var(--line); }
  .splitter:hover::after, .splitter.drag::after { background: var(--dim); }

  footer { flex: none; padding: 0 16px 16px; }
  footer .card { margin-bottom: 0; padding: 12px 14px; }
  footer .panelhead { margin-bottom: 10px; }
  #term {
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-all;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; height: 170px; overflow-y: auto; margin-bottom: 8px;
  }
  footer.fold #term { display: none; }
  .cmdline { display: flex; gap: 8px; }
  .cmdline input { font-family: var(--mono); flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="app">

<header>
  <div class="titlerow">
    <h1>NU87-TinyDK <span>개발보드</span></h1>
    <span class="grow"></span>

    <span id="connectGroup">
      <button id="btnBle">BLE 연결</button>
      <button id="btnUsb">USB 연결</button>
    </span>

    <span class="link" id="linkGroup" hidden>
      <span class="dot"></span>
      <b id="linkName"></b>
      <button id="btnDisconnect">해제</button>
    </span>
  </div>
  <div id="summary">연결되지 않았다</div>
</header>

<main>
  <div class="panelhead">
    <nav class="tabs">
      <button class="on" data-tab="board">보드</button>
      <button data-tab="wifi">WiFi <span class="badge" id="badgeNet"></span></button>
      <button data-tab="fw">펌웨어</button>
    </nav>
    <span class="grow"></span>
    <button class="act" id="btnRefresh" disabled>갱신</button>
  </div>

  <section id="tab-board" class="on">
    <div id="msg"></div>
    <div class="card">
      <h2>상세</h2>
      <dl id="info"><dt>상태</dt><dd>—</dd></dl>
    </div>
  </section>

  <section id="tab-wifi">
    <div class="card">
      <h2>주변 검색</h2>
      <div class="row">
        <button id="btnScan" disabled>검색</button>
        <select id="apSelect" style="flex:1;min-width:200px" hidden></select>
        <span class="note" style="margin:0" id="scanNote"></span>
      </div>
    </div>

    <div class="card">
      <h2>접속</h2>
      <form id="wifiForm">
        <div>
          <label for="ssid">SSID</label>
          <input id="ssid" autocomplete="off" spellcheck="false" placeholder="공유기 이름">
        </div>
        <div>
          <label for="pass">비밀번호</label>
          <input id="pass" type="password" autocomplete="off" placeholder="없으면 비워 둔다">
        </div>
        <button class="primary" id="btnWifi" disabled>접속</button>
      </form>
      <p class="note">저장 후 다음 부팅부터 자동으로 붙는다. <code>nvs</code> 에 남는다.</p>
    </div>
  </section>

  <section id="tab-fw">
    <div class="card">
      <h2>슬롯</h2>
      <dl id="otaInfo"><dt>실행 중</dt><dd>—</dd></dl>
      <p class="note">
        쓰기는 지금 실행 중이 아닌 슬롯으로 간다. 실패해도 지금 펌웨어가 그대로
        남아 보드가 죽지 않는다. 다 받고 검증된 뒤에야 부팅 슬롯이 바뀐다.
      </p>
    </div>

    <div class="card">
      <h2>이미지</h2>
      <div class="row">
        <label class="pick"><input type="radio" name="fwsrc" id="srcRel" checked> 배포본</label>
        <label class="pick"><input type="radio" name="fwsrc" id="srcLocal"> 직접 고르기</label>
      </div>

      <div class="row" id="rowRel">
        <button id="btnFwReload">검색</button>
        <select id="fwSelect" style="flex:1;min-width:200px">
          <option value="">불러오는 중…</option>
        </select>
      </div>

      <div class="row" id="rowLocal" hidden>
        <input type="file" id="fwFile" accept=".bin" style="flex:1;min-width:200px">
      </div>

      <h2 style="margin-top:22px">보내기</h2>
      <div class="row">
        <button class="primary" id="btnFlash" disabled>보내기</button>
        <button id="btnStop" hidden>중지</button>
        <button class="primary" id="btnReboot" hidden>재부팅</button>
      </div>
      <div class="bar"><div id="fwBar"></div></div>
      <p class="note" id="fwNote">배포본을 고르거나 파일을 직접 지정할 것.</p>
    </div>
  </section>
</main>

<div class="splitter" id="splitter" title="끌어서 높이 조절"></div>

<footer id="console">
  <div class="card">
    <div class="panelhead">
      <nav class="tabs"><button class="on">콘솔</button></nav>
      <span class="grow"></span>
      <button class="act" id="btnFold">접기</button>
      <button class="act" id="btnClear">지우기</button>
    </div>
    <div id="term"></div>
    <div class="cmdline">
      <input id="cmd" placeholder="help" autocomplete="off" spellcheck="false" disabled>
      <button id="btnSend" disabled>보내기</button>
    </div>
  </div>
</footer>

</div>

<script>
/* 펌웨어 hw/driver/ble_svc.c 의 정의와 같아야 한다. */
const SVC    = 0xFF87;
const CLI_RX = 0xFF88;   /* 호스트 -> 보드 */
const CLI_TX = 0xFF89;   /* 보드 -> 호스트 */
const DAT_RX = 0xFF8A;   /* 대량 전송용 */
const DAT_TX = 0xFF8B;

const PROMPT = 'cli# ';
const CHUNK  = 1024;     /* 펌웨어의 OTA_CHUNK_MAX 이하 */

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();

let transport = null;    /* { name, writeCli, writeDat, onDat, close } */
let stopFlash = false;
let pending   = null;    /* 내려받아 검사까지 끝난 이미지 { name, bytes } */
let selected  = null;    /* 고른 배포본. 내려받기는 보낼 때 한다 */
let rxBuf  = '';
let waiter = null;

/* notify 는 잘려 온다. 한글은 UTF-8 로 3 바이트라 글자 하나가 두 조각에
 * 걸치는 일이 흔하다. 스트림 모드로 두어 걸친 조각을 이어 붙인다.
 * 이걸 빠뜨리면 "동기됨" 이 "동???됨" 으로 보인다. */
let dec = new TextDecoder('utf-8');


/* ── 화면 ──────────────────────────────────────────────────────────── */

function say(text, kind) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = kind || '';
}

function termWrite(text) {
  const el = $('term');
  el.textContent += text;
  el.scrollTop = el.scrollHeight;
}

/* 연결 여부는 버튼 색이 아니라 보이는 컨트롤 자체로 나타낸다.
 * 색만 다르게 하면 "강조된 버튼 = 지금 그걸로 붙어 있다" 로 읽힌다. */
function setConnected(on, via) {
  $('connectGroup').hidden = on;
  $('linkGroup').hidden = !on;
  $('linkName').textContent = via || '';

  for (const id of ['btnWifi', 'btnScan', 'btnSend', 'btnRefresh', 'btnFlash', 'cmd'])
    $(id).disabled = !on;

  if (!on) $('summary').textContent = '연결되지 않았다';
}


/* ── 통로 ──────────────────────────────────────────────────────────── */

/* CLI 출력을 모으고 프롬프트가 보이면 한 명령이 끝난 것으로 본다.
 * 보드는 글자마다 에코를 돌려주고 끝에 프롬프트를 찍는다. */
function onCliData(bytes) {
  const text = dec.decode(bytes, { stream: true });
  rxBuf += text;
  termWrite(text);

  if (waiter && rxBuf.includes(PROMPT)) {
    const done = waiter;
    waiter = null;
    done(rxBuf);
  }
}

async function openBle() {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ services: [SVC] }],
    optionalServices: [SVC],
  });
  device.addEventListener('gattserverdisconnected', () => {
    transport = null;
    setConnected(false);
    say('연결이 끊겼다');
  });

  const gatt = await device.gatt.connect();
  const svc  = await gatt.getPrimaryService(SVC);

  const cliRx = await svc.getCharacteristic(CLI_RX);
  const datRx = await svc.getCharacteristic(DAT_RX);

  /* CLI TX 를 구독해야 보드가 CLI 를 BLE 쪽으로 넘긴다. cli_mgr 이
   * cliBleIsConnected() 로 판단하는데 그게 notify 여부를 본다. */
  const cliTx = await svc.getCharacteristic(CLI_TX);
  await cliTx.startNotifications();
  cliTx.addEventListener('characteristicvaluechanged',
                         (e) => onCliData(e.target.value));

  const datTx = await svc.getCharacteristic(DAT_TX);
  await datTx.startNotifications();

  let datCb = null;
  datTx.addEventListener('characteristicvaluechanged', (e) => {
    if (datCb) datCb(new Uint8Array(e.target.value.buffer));
  });

  /* 한 번에 보낼 수 있는 크기는 MTU-3 이다. 협상값을 알 수 없어 최소 MTU
   * 기준으로 자른다. */
  const write = async (ch, bytes) => {
    for (let i = 0; i < bytes.length; i += 20) {
      const part = bytes.slice(i, i + 20);
      if (ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(part);
      else                              await ch.writeValue(part);
    }
  };

  return {
    name: 'BLE',
    dataChannel: 4,                        /* _DEF_UART4 = HW_UART_CH_BLE_DATA */
    writeCli: (b) => write(cliRx, b),
    writeDat: (b) => write(datRx, b),
    onDat: (cb) => { datCb = cb; },
    close: () => { if (device.gatt.connected) device.gatt.disconnect(); },
  };
}

async function openUsb() {
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 115200 });

  const writer = port.writable.getWriter();
  let reader  = null;
  let datCb   = null;
  let closing = false;

  /* USB 는 채널이 하나다. CLI 와 대량 전송이 같은 선을 쓴다.
   * ota write 에 채널을 주지 않으면 보드가 지금 CLI 채널로 받는다. */
  (async () => {
    while (!closing) {
      reader = port.readable.getReader();
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (datCb) datCb(value);
          else       onCliData(value);
        }
      } catch (e) { /* cancel() 로 깨어난다 */ }
      finally { reader.releaseLock(); }
    }
  })();

  return {
    name: 'USB',
    dataChannel: null,
    writeCli: (b) => writer.write(b),
    writeDat: (b) => writer.write(b),
    onDat: (cb) => { datCb = cb; },
    /* ★ 읽는 쪽을 먼저 풀어야 포트가 닫힌다.
     * port.close() 는 reader / writer 가 잠금을 쥐고 있으면 거절한다.
     * 앞서 writer 만 풀고 reader 는 읽기에 매달린 채로 두어서, 해제를 눌러도
     * 실제로는 닫히지 않고 다른 도구가 포트를 열지 못했다. */
    close: async () => {
      closing = true;
      try { if (reader) await reader.cancel(); } catch (e) { /* 이미 풀림 */ }
      try { writer.releaseLock(); }             catch (e) { /* 이미 풀림 */ }
      try { await port.close(); }               catch (e) { /* 이미 닫힘 */ }
    },
  };
}

async function connect(open, label) {
  try {
    say(label + ' 연결 중…');
    transport = await open();

    dec = new TextDecoder('utf-8');   /* 이전 연결에서 남은 조각을 버린다 */
    setConnected(true, transport.name);
    say('연결됨', 'ok');
    $('term').textContent = '';

    await refresh();
  } catch (e) {
    transport = null;
    say(e.message, 'err');
    setConnected(false);
  }
}

async function disconnect() {
  const t = transport;
  transport = null;
  setConnected(false);
  say('');

  if (t) { try { await t.close(); } catch (e) { say(e.message, 'err'); } }
}


/* ── CLI ───────────────────────────────────────────────────────────── */

async function send(line, timeoutMs = 6000) {
  if (!transport) throw new Error('연결되지 않았다');

  rxBuf = '';
  const answer = new Promise((resolve) => {
    waiter = resolve;
    setTimeout(() => {
      if (waiter === resolve) { waiter = null; resolve(rxBuf); }
    }, timeoutMs);
  });

  /* CLI 는 Enter 를 CR 로만 받는다. */
  await transport.writeCli(enc.encode(line + '\r'));
  return answer;
}

/* CLI 출력은 "key   : value" 꼴이다. */
function parseKV(text) {
  const out = {};
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*([A-Za-z가-힣 ]+?)\s*:\s*(.+?)\s*$/);
    if (m && m[1] !== 'cli') out[m[1]] = m[2];
  }
  return out;
}

function renderDl(el, rows) {
  el.innerHTML = '';
  for (const [k, v] of rows) {
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = k;
    dd.textContent = v;
    el.append(dt, dd);
  }
}

async function refresh() {
  try {
    const net = parseKV(await send('net info'));

}

/* wifi scan 출력은 고정폭 표다.
 *   no  ssid                       rssi  chan  security
 *   0   olleh_WiFi_4479             -62     9  WPA/WPA2
 * SSID 에 공백이 들어갈 수 있어 앞뒤에서 잘라 가운데를 이름으로 본다. */
function parseScan(text) {
  const list = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*\d+\s+(.*?)\s+(-?\d+)\s+(\d+)\s+(\S+)\s*$/);
    if (m) list.push({ ssid: m[1], rssi: +m[2], chan: +m[3], sec: m[4] });
  }
  return list;
}

function renderScan(list) {
  const sel = $('apSelect');

  sel.innerHTML = '';
  sel.hidden = list.length === 0;
  if (!list.length) return;

  for (const ap of list) {
    const o = document.createElement('option');
    o.value = ap.ssid;
    o.textContent = `${ap.ssid} · ${ap.rssi} dBm · ch${ap.chan} · ${ap.sec}`;
    sel.append(o);
  }

  /* 신호가 센 것이 위로 오므로 첫 항목이 대개 맞다. 바로 채워 둔다. */
  sel.selectedIndex = 0;
  $('ssid').value = list[0].ssid;
}

async function scan() {
  $('btnScan').disabled = true;
  $('scanNote').textContent = '검색 중… 10초쯤 걸린다';
  try {
    /* 보드가 스캔하는 동안 CLI 가 막힌다. 넉넉히 기다린다. */
    const list = parseScan(await send('wifi scan', 20000));
    renderScan(list);
    $('scanNote').textContent = list.length + ' 개';
  } catch (e) {
    $('scanNote').textContent = e.message;
  }
  $('btnScan').disabled = false;
}

/* 접속은 보드의 스레드가 진행한다. 정해진 시간을 기다리는 대신 상태를 물어본다. */
async function waitOnline(timeoutMs = 25000) {
  const until = Date.now() + timeoutMs;

  while (Date.now() < until) {
    const net = parseKV(await send('net info'));
    if (net.state === 'ONLINE') return net;
    say('접속 중… ' + (net.state || ''));
    await new Promise((r) => setTimeout(r, 2000));
  }
  return null;
}


/* ── 펌웨어 ────────────────────────────────────────────────────────── */

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (const b of bytes) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
  }
  return (~crc) >>> 0;
}

/* len(2 LE) | data | sum(1). 링크에서 한 바이트가 밀려도 이 청크만 다시 보낸다. */
function frame(data) {
  const out = new Uint8Array(data.length + 3);
  out[0] = data.length & 0xFF;
  out[1] = data.length >> 8;
  out.set(data, 2);
  let sum = 0;
  for (const b of data) sum = (sum + b) & 0xFF;
  out[out.length - 1] = sum;
  return out;
}

/* 데이터 채널로 오는 한 줄을 기다린다. 보드가 보내는 말은 전부 한 줄이다.
 *
 * USB 는 선이 하나라 CLI 에코가 같은 곳으로 돌아온다. 첫 줄을 곧바로 응답으로
 * 받으면 에코된 명령을 응답으로 착각한다. 그래서 기대하는 말이 나올 때까지
 * 건너뛴다. BLE 는 채널이 따로라 해당이 없지만 같은 코드로 둔다. */
function makeLineReader() {
  let buf = '';
  const lines = [];
  let wake = null;
  const d = new TextDecoder('utf-8');

  transport.onDat((bytes) => {
    buf += d.decode(bytes, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) lines.push(line);
    }
    if (wake) { const w = wake; wake = null; w(); }
  });

  /* expect 가 나올 때까지 읽는다. 오류(e####)와 재전송 요청(r)은 바로 돌려준다. */
  return async (expect, timeoutMs = 15000) => {
    const until = Date.now() + timeoutMs;

    while (Date.now() < until) {
      if (lines.length) {
        const line = lines.shift();
        if (line === expect) return line;
        if (line === 'r')    return line;
        if (/^e[0-9A-Fa-f]{4}$/.test(line)) throw new Error('보드 오류 0x' + line.slice(1));
        continue;                       /* 에코 등 그 밖의 줄은 버린다 */
      }
      await new Promise((r) => { wake = r; setTimeout(r, 100); });
    }
    throw new Error("'" + expect + "' 를 받지 못했다");
  };
}

/* 고른 파일이 어떤 이미지인지 읽는다. 보내기 전에 알아야 할 것이 둘이다.
 *
 *   이름과 버전   헤더 체인을 걸어가 ram 파트를 찾고 그 +32 의 firm_ver_t 를
 *                 읽는다. 링커스크립트가 거기 고정해 둔다.
 *   무선 지원     로그 문자열이 rodata 에 그대로 남아 있어 그것으로 가른다.
 *                 표식을 따로 심는 것보다 낫다 — 지금까지 만든 이미지에도
 *                 이미 들어 있어 펌웨어를 고칠 필요가 없다.
 */
const IMG_SIG = '81958711';

function readImage(bytes) {
  const dv = new DataView(bytes.buffer);
  const info = { parts: [], wifi: false, ble: false, name: '', ver: '' };
  const sig = (o) => String.fromCharCode.apply(null, bytes.slice(o, o + 8));

  let off = 0;
  while (off + 32 <= bytes.length) {
    if (sig(off) !== IMG_SIG) {
      /* KM0 이미지는 4KB 로 패딩된다. 경계까지 건너뛰고 다시 본다. */
      const next = ((off >> 12) + 1) << 12;
      if (next <= off || next + 32 > bytes.length) break;
      off = next;
      continue;
    }
    const len  = dv.getUint32(off + 8, true);
    const addr = dv.getUint32(off + 12, true);
    info.parts.push({ start: off + 32, len, addr });
    off += 32 + len;
  }

  const ram = info.parts.find((p) => p.addr === 0x10005000);
  if (ram) {
    const v = bytes.slice(ram.start + 32, ram.start + 32 + 68);
    const str = (a, b) => {
      let t = v.slice(a, b);
      const end = t.indexOf(0);
      if (end >= 0) t = t.slice(0, end);
      return String.fromCharCode.apply(null, t);
    };
    info.ver  = str(4, 36);
    info.name = str(36, 68);
  }

  const text = new TextDecoder('latin1').decode(bytes);
  info.wifi = text.includes('wifiInit()');
  info.ble  = text.includes('bleInit()');

  return info;
}

/* 고른 이미지를 검사해 보낼 준비를 한다. 로컬 파일이든 배포본이든 여기로 모인다. */
function setPending(name, bytes) {
  $('fwBar').style.width = '0';
  $('fwNote').style.color = '';
  $('btnReboot').hidden = true;

  const img = readImage(bytes);

  if (!img.name) {
    $('fwNote').textContent = '이미지 형식이 아니다. km0_km4_image2.bin 인지 확인할 것';
    $('fwNote').style.color = 'var(--err)';
    $('btnFlash').disabled = true;
    pending = null;
    return;
  }

  const feat = [img.wifi ? 'WiFi' : null, img.ble ? 'BLE' : null]
                 .filter(Boolean).join(' + ') || '무선 없음';

  /* 지금 붙어 있는 통로가 새 이미지에 없으면 올리는 순간 못 돌아온다. */
  const lost = transport && transport.name === 'BLE' && !img.ble;

  $('fwNote').textContent =
    `${img.name} · ${img.ver} · ${feat} · ${bytes.length} B` +
    (lost ? '   ⚠ 이 이미지에는 BLE 가 없다. 올리면 다시 붙지 못하고 USB 로만 복구된다' : '');
  if (lost) $('fwNote').style.color = 'var(--err)';

  pending = { name, bytes };
  $('btnFlash').disabled = !transport;
}

/* 배포본은 저장소에 함께 올려 Pages 가 서빙한다.
 * 릴리스 자산은 쓸 수 없다 — release-assets.githubusercontent.com 이 CORS
 * 헤더를 주지 않아 브라우저가 막는다. 이렇게 두면 같은 출처라 제약이 없다. */
let releases = [];

async function loadReleases() {
  const sel = $('fwSelect');

  const only = (text) => {
    sel.innerHTML = '';
    const o = document.createElement('option');
    o.value = '';
    o.textContent = text;
    sel.append(o);
  };

  try {
    const res = await fetch('fw/manifest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const list = await res.json();
    releases = list;

    if (!list.length) { only('배포본이 없다'); return; }

    sel.innerHTML = '';
    for (const it of list) {
      const o = document.createElement('option');
      o.value = it.file;
      o.textContent = `${it.ver} · ${it.feat} · ${(it.size / 1024).toFixed(0)} KB · ${it.date}`;
      sel.append(o);
    }

    /* 새 것이 위로 온다. 첫 항목을 골라 두되 내려받지는 않는다 —
     * 페이지를 열 때마다 수백 KB 를 받을 이유가 없다. 보낼 때 받는다. */
    sel.selectedIndex = 0;
    if ($('srcRel').checked) pickRelease(list[0]);
  } catch (e) {
    only('배포본 목록을 읽지 못했다');
  }
}

/* 출처는 하나만 고른다.
 *
 * 전에는 배포본을 고른 뒤 파일을 지정해도 선택창에 배포본이 그대로 보여서
 * 무엇이 나갈지 알 수 없었다. 라디오로 갈라 한쪽만 보이게 한다. */
function setSource(kind) {
  $('rowRel').hidden   = kind !== 'rel';
  $('rowLocal').hidden = kind === 'rel';

  pending = null;
  selected = null;
  $('fwBar').style.width = '0';
  $('fwNote').style.color = '';
  $('btnFlash').disabled = true;

  if (kind === 'rel') {
    const it = releases.find((r) => r.file === $('fwSelect').value);
    if (it) pickRelease(it);
    else    $('fwNote').textContent = '배포본을 고를 것.';
  } else {
    $('fwFile').value = '';
    $('fwNote').textContent = 'km0_km4_image2.bin 을 고를 것.';
  }
}

/* 매니페스트에 적힌 것만 먼저 보여준다. 실제 검사는 내려받은 뒤에 한다. */
function pickRelease(it) {
  selected = it;
  pending = null;

  $('fwBar').style.width = '0';
  $('fwNote').style.color = '';
  $('fwNote').textContent =
    `${it.ver} · ${it.feat} · ${it.size} B   (보낼 때 내려받는다)`;
  $('btnFlash').disabled = !transport;
}

async function fetchRelease(it) {
  $('fwNote').textContent = '내려받는 중…';

  const res = await fetch('fw/' + it.file, { cache: 'no-store' });
  if (!res.ok) throw new Error('내려받기 실패 ' + res.status);

  setPending(it.file, new Uint8Array(await res.arrayBuffer()));
  if (!pending) throw new Error('이미지 형식이 아니다');
}

async function flashFirmware(item) {
  const payload = item.bytes;
  const crc = crc32(payload);

  $('btnFlash').disabled = true;
  $('btnStop').hidden = false;
  $('btnReboot').hidden = true;
  stopFlash = false;
  $('fwNote').textContent = `${item.name} · ${payload.length} B · crc32 0x${crc.toString(16).toUpperCase()}`;

  try {
    const readLine = makeLineReader();
    const ch = transport.dataChannel ? ' ' + transport.dataChannel : '';

    await transport.writeCli(enc.encode(`ota write ${payload.length} ${crc}${ch}\r`));
    await readLine('ready', 20000);

    let sent = 0;
    let resend = 0;
    const started = Date.now();

    while (sent < payload.length) {
      /* 길이 0 을 보내면 보드가 받기를 그만둔다. 그냥 끊으면 5초 뒤
       * 타임아웃으로 끝나는데 그건 사고와 구분이 되지 않는다. */
      if (stopFlash) {
        await transport.writeDat(new Uint8Array([0, 0]));
        throw new Error('중지했다. 지금 펌웨어는 그대로다');
      }

      const chunk = payload.slice(sent, sent + CHUNK);
      await transport.writeDat(frame(chunk));

      if (await readLine('a') === 'r') {
        if (++resend > 5) throw new Error('같은 청크가 계속 깨진다');
        continue;
      }

      resend = 0;
      sent += chunk.length;

      const pct = Math.floor(sent * 100 / payload.length);
      const rate = sent / Math.max(0.001, (Date.now() - started) / 1000) / 1024;
      $('fwBar').style.width = pct + '%';
      $('fwNote').textContent = `${pct}%  ${sent}/${payload.length} B  ${rate.toFixed(1)} KB/s`;
    }

    await readLine('ok', 30000);

    /* 슬롯만 바꿔 두었을 뿐 지금은 여전히 옛 펌웨어가 돌고 있다.
     * 그래서 링크도 그대로다. 적용하려면 재부팅해야 한다. */
    $('fwNote').textContent = '전환 완료. 재부팅해야 새 펌웨어로 뜬다';
    $('btnReboot').hidden = false;
    say('업데이트 완료 — 재부팅하면 적용된다', 'ok');
  } catch (e) {
    $('fwNote').textContent = '실패: ' + e.message;
    say(e.message, 'err');
  }

  transport.onDat(null);
  $('btnStop').hidden = true;
  $('btnFlash').disabled = false;
}

/* 본문 탭만 고른다. 콘솔의 탭 버튼은 data-tab 이 없어 여기 걸리면 예외가 나고

/* 콘솔 높이 — 분리막을 끌어 조절한다. term 높이만 바꾸면 나머지는 따라온다.
 * 시작점 대비 이동량으로 계산한다. 절대 좌표로 하면 여백을 하나라도 빠뜨렸을 때
 * 커서와 경계가 어긋난다. */
const TERM_MIN = 0;

function setTermHeight(px) {
  const max = Math.max(60, document.documentElement.clientHeight - 380);
  const h = Math.min(max, Math.max(TERM_MIN, Math.round(px)));

  $('term').style.height = h + 'px';
  $('console').classList.toggle('fold', h <= TERM_MIN);
  $('btnFold').textContent = h <= TERM_MIN ? '펴기' : '접기';
  localStorage.setItem('termHeight', h);
}

setTermHeight(+localStorage.getItem('termHeight') ?? 170);

addEventListener('resize', () => setTermHeight($('term').offsetHeight));

$('btnFold').addEventListener('click', () => {
  setTermHeight($('console').classList.contains('fold') ? 170 : TERM_MIN);
});

    await refresh();

    if (net) say('접속됨 ' + (net.ip || '') + ' — 다음 부팅부터 자동', 'ok');
    else     say('시간 안에 붙지 못했다. SSID 와 비밀번호를 확인할 것', 'err');
  } catch (e) {
    say(e.message, 'err');
  }
  $('btnWifi').disabled = false;
});

$('btnSend').addEventListener('click', () => $('cmd').dispatchEvent(
  new KeyboardEvent('keydown', { key: 'Enter' })));

$('cmd').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const line = $('cmd').value;
  $('cmd').value = '';
  await send(line);
});

/* 안드로이드 Chrome 에는 Web Serial 이 없다. 있는 것만 보여준다. */
loadReleases();

if (!navigator.serial)    $('btnUsb').hidden = true;
if (!navigator.bluetooth) $('btnBle').hidden = true;

if (!navigator.bluetooth && !navigator.serial) {
  say('이 브라우저는 Web Bluetooth / Web Serial 을 지원하지 않는다. Chrome 이나 Edge 를 쓸 것', 'err');
}
</script>
</body>
</html>
